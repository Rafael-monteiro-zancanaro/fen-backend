databaseChangeLog:
  - changeSet:
      id: create-medication-table
      author: rafael.zancanaro
      changes:
        - createTable:
            tableName: medication
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(254)
                  constraints:
                    nullable: false
              - column:
                  name: measurementunit
                  type: varchar(254)
                  constraints:
                    nullable: false
              - column:
                  name: administrationroute
                  type: varchar(254)
                  constraints:
                    nullable: false
              - column:
                  name: createdat
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updatedat
                  type: timestamp
              - column:
                  name: createdby
                  type: varchar(255)
              - column:
                  name: updatedby
                  type: varchar(255)

  - changeSet:
      id: create-comorbity-table
      author: rafael.zancanaro
      changes:
        - createTable:
            tableName: comorbity
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(254)
                  constraints:
                    nullable: false
              - column:
                  name: createdat
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updatedat
                  type: timestamp
              - column:
                  name: createdby
                  type: varchar(255)
              - column:
                  name: updatedby
                  type: varchar(255)

  - changeSet:
      id: create-comorbity-medication-table
      author: rafael.zancanaro
      changes:
        - createTable:
            tableName: comorbitymedication
            columns:
              - column:
                  name: comorbity_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
                    referencedTableName: comorbity
                    referencedColumnNames: id
                    foreignKeyName: fk_comorbity_id_on_comorbitymedication
              - column:
                  name: medication_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
                    referencedTableName: medication
                    referencedColumnNames: id
                    foreignKeyName: fk_medication_id_on_comorbitymedication

  - changeSet:
      id: create-medication-aud-table
      author: rafael.zancanaro
      changes:
        - createTable:
            schemaName: aud
            tableName: medication_aud
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: rev
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: revtype
                  type: smallint
              - column:
                  name: name
                  type: varchar(254)
                  constraints:
                    nullable: false
              - column:
                  name: measurementunit
                  type: varchar(254)
                  constraints:
                    nullable: false
              - column:
                  name: administrationroute
                  type: varchar(254)
                  constraints:
                    nullable: false
              - column:
                  name: createdat
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updatedat
                  type: timestamp
              - column:
                  name: createdby
                  type: varchar(255)
              - column:
                  name: updatedby
                  type: varchar(255)
        - addPrimaryKey:
            schemaName: aud
            tableName: medication_aud
            columnNames: id, rev
            constraintName: pk_medication_aud
        - addForeignKeyConstraint:
            baseTableSchemaName: aud
            baseTableName: medication_aud
            baseColumnNames: rev
            referencedTableSchemaName: aud
            referencedTableName: revinfo
            referencedColumnNames: rev
            constraintName: fk_medication_aud_rev

  - changeSet:
      id: create-comorbity-aud-table
      author: rafael.zancanaro
      changes:
        - createTable:
            schemaName: aud
            tableName: comorbity_aud
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: rev
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: revtype
                  type: smallint
              - column:
                  name: name
                  type: varchar(254)
                  constraints:
                    nullable: false
              - column:
                  name: createdat
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updatedat
                  type: timestamp
              - column:
                  name: createdby
                  type: varchar(255)
              - column:
                  name: updatedby
                  type: varchar(255)
        - addPrimaryKey:
            schemaName: aud
            tableName: comorbity_aud
            columnNames: id, rev
            constraintName: pk_comorbity_aud
        - addForeignKeyConstraint:
            baseTableSchemaName: aud
            baseTableName: comorbity_aud
            baseColumnNames: rev
            referencedTableSchemaName: aud
            referencedTableName: revinfo
            referencedColumnNames: rev
            constraintName: fk_comorbity_aud_rev
