databaseChangeLog:
  - changeSet:
      id: create-solicitacao-recuperacao-senha
      author: codex
      changes:
        - createTable:
            tableName: solicitacaorecuperacaosenha
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: usuarioid, type: uuid, constraints: { nullable: false } }
              - column: { name: novasenhahash, type: varchar(100), constraints: { nullable: false } }
              - column: { name: status, type: varchar(20), constraints: { nullable: false } }
              - column: { name: version, type: bigint, constraints: { nullable: false } }
              - column: { name: createdat, type: timestamp, constraints: { nullable: false } }
              - column: { name: updatedat, type: timestamp }
              - column: { name: createdby, type: varchar(255) }
              - column: { name: updatedby, type: varchar(255) }
        - addForeignKeyConstraint:
            baseTableName: solicitacaorecuperacaosenha
            baseColumnNames: usuarioid
            referencedTableName: usuario
            referencedColumnNames: id
            constraintName: fk_solicitacaorecuperacaosenha_usuario
        - createIndex:
            tableName: solicitacaorecuperacaosenha
            indexName: idx_solicitacaorecuperacaosenha_status_createdat
            columns:
              - column: { name: status }
              - column: { name: createdat }
        - createTable:
            schemaName: aud
            tableName: solicitacaorecuperacaosenha_aud
            columns:
              - column: { name: id, type: uuid, constraints: { nullable: false } }
              - column: { name: rev, type: int, constraints: { nullable: false } }
              - column: { name: revtype, type: smallint }
              - column: { name: usuarioid, type: uuid }
              - column: { name: status, type: varchar(20) }
              - column: { name: version, type: bigint }
              - column: { name: createdat, type: timestamp }
              - column: { name: updatedat, type: timestamp }
              - column: { name: createdby, type: varchar(255) }
              - column: { name: updatedby, type: varchar(255) }
        - addPrimaryKey: { schemaName: aud, tableName: solicitacaorecuperacaosenha_aud, columnNames: "id, rev", constraintName: pk_solicitacaorecuperacaosenha_aud }
        - addForeignKeyConstraint: { baseTableSchemaName: aud, baseTableName: solicitacaorecuperacaosenha_aud, baseColumnNames: rev, referencedTableSchemaName: aud, referencedTableName: revinfo, referencedColumnNames: rev, constraintName: fk_solicitacaorecuperacaosenha_aud_rev }
